[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-cleanup-tool"
version = "1.0.0"
description = "Safely clean up messy folders by renaming, deduplicating, organizing, and archiving files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Folder Cleanup Tool Team" }
]
dependencies = [
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
folder-cleanup = "folder_cleanup.main:main"

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]
